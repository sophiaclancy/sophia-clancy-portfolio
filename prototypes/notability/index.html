<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Study Session · Notability prototype</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="room">
    <div class="ipad" id="ipad">
      <div class="screen" id="screen"></div>
    </div>
    <p class="hint">Press <kbd>?</kbd> to jump between screens · <kbd>Esc</kbd> goes back</p>
  </div>
  <div class="jumper" id="jumper" hidden></div>
  <script src="app.js"></script>
</body>
</html>
